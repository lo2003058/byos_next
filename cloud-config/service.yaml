# Reference spec of the Cloud Run service; the real settings are the flags in
# .github/workflows/deploy-prod.yaml. Kept for documentation only.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: byos-next
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
    spec:
      timeoutSeconds: 60
      containers:
        - image: us-east4-docker.pkg.dev/my-side-projects-462703/byos/byos-next:latest
          ports:
            - containerPort: 3000
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            failureThreshold: 12
